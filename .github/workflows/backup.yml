name: db-backup

# 자동 정기 백업(오프사이트) + 복구 리허설.
#  - 매일 1회 Supabase 핵심 테이블을 JSON으로 내보내 GitHub '아티팩트'로 보관
#    → Vercel/Supabase와 다른 GitHub 인프라에 저장되므로 오프사이트 백업이 된다.
#  - 같은 잡에서 restore-db.mjs 리허설을 돌려 "백업이 실제로 복원 가능한 형식인지" 검증.
#  - 필요 시크릿(저장소 Settings → Secrets and variables → Actions):
#      SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
on:
  schedule:
    - cron: "0 18 * * *"   # 매일 UTC 18:00 (KST 03:00)
  workflow_dispatch:        # 수동 실행 가능

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Export DB snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-db.mjs --out backup.json

      # 복구 리허설: 백업 파일 구조 검증 + 라이브 행수 대조(읽기 전용, 쓰기 없음).
      - name: Recovery rehearsal (verify restorable)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/restore-db.mjs backup.json

      # 오프사이트 보관: GitHub 아티팩트로 업로드(기본 retention, 여기선 90일).
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.json
          retention-days: 90
