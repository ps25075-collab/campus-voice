name: secret-scan

# 저장소 시크릿 스캐닝: 푸시·PR마다 git 히스토리 전체를 gitleaks로 검사해
# service_role 키·비밀번호·토큰 등이 커밋되면 CI를 실패시킨다.
# (GitHub 네이티브 secret scanning과 병행 — 설정: Settings → Security → Secret scanning)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 전체 히스토리 검사
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
